# 可选透明 SOCKS5 出口网关覆盖编排（覆盖主服务 artex 及 --profile runners 动态 Runner）。
#
# 用法（在仓库根目录执行，需 Docker Compose v2.20+ 支持 !reset）：
#   1) 仅主服务：
#      docker compose -f docker-compose.yml -f deploy/egress-proxy/docker-compose.socks5.yml up -d --build
#   2) 同时包含动态 Runner 池：
#      docker compose -f docker-compose.yml -f deploy/egress-proxy/docker-compose.socks5.yml --profile runners up -d --build
#
# 架构隔离：
#   - artex-egress-gw 加入 default + runners（对外发布 8787/8788 并以别名 artex 提供服务发现），
#     artex 共享其网络命名空间并继续保持 cap_drop: [ALL]。
#   - runner-egress-gw 仅加入 runners 网络（绝不接入 postgres 所在的 default 网络），
#     runner-manager 创建的临时 Runner 容器以 --network container:artex-runner-egress-gw 加入该网关。

x-egress-logging: &egress-logging
  driver: json-file
  options:
    max-size: "8m"
    max-file: "3"

services:
  artex-egress-gw:
    build:
      context: ./deploy/egress-proxy
      dockerfile: Dockerfile
      args:
        SING_BOX_IMAGE: ${EGRESS_SING_BOX_IMAGE:-ghcr.io/sagernet/sing-box:v1.14.4}
        ALPINE_MIRROR: ${EGRESS_ALPINE_MIRROR:-}
    image: ${EGRESS_PROXY_IMAGE:-artex-egress-gw:local}
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    init: true
    logging: *egress-logging
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EGRESS_SOCKS5_URL: ${ARTEX_EGRESS_SOCKS5_URL:-${EGRESS_SOCKS5_URL:?请在 .env 或环境变量设置 EGRESS_SOCKS5_URL}}
      EGRESS_DNS_SERVER: ${EGRESS_DNS_SERVER:-1.1.1.1}
      EGRESS_DNS_STRATEGY: ${EGRESS_DNS_STRATEGY:-ipv4_only}
      EGRESS_INTERNAL_DOMAINS: ${ARTEX_EGRESS_INTERNAL_DOMAINS:-postgres,artex}
      EGRESS_BYPASS_DOMAINS: ${ARTEX_EGRESS_BYPASS_DOMAINS:-${EGRESS_BYPASS_DOMAINS:-}}
      EGRESS_BYPASS_CIDRS: ${ARTEX_EGRESS_BYPASS_CIDRS:-${EGRESS_BYPASS_CIDRS:-}}
      EGRESS_KILL_SWITCH: ${EGRESS_KILL_SWITCH:-1}
      EGRESS_SOCKS5_UDP: ${EGRESS_SOCKS5_UDP:-0}
      EGRESS_HIJACK_TUN_DNS: ${EGRESS_HIJACK_TUN_DNS:-1}
      EGRESS_IPV6: ${EGRESS_IPV6:-0}
      EGRESS_TUN_ADDR: ${ARTEX_EGRESS_TUN_ADDR:-198.19.0.1/30}
      EGRESS_LOG_LEVEL: ${EGRESS_LOG_LEVEL:-info}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    networks:
      default:
        aliases:
          - artex
      runners:
        aliases:
          - artex
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/egress-ready && ip -4 addr show dev tun0 2>/dev/null | grep -q 'inet ' && pidof sing-box >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  artex:
    network_mode: "service:artex-egress-gw"
    ports: !reset []
    networks: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      artex-egress-gw:
        condition: service_healthy

  runner-egress-gw:
    build:
      context: ./deploy/egress-proxy
      dockerfile: Dockerfile
      args:
        SING_BOX_IMAGE: ${EGRESS_SING_BOX_IMAGE:-ghcr.io/sagernet/sing-box:v1.14.4}
        ALPINE_MIRROR: ${EGRESS_ALPINE_MIRROR:-}
    image: ${EGRESS_PROXY_IMAGE:-artex-egress-gw:local}
    container_name: ${ARTEX_RUNNER_EGRESS_CONTAINER:-artex-runner-egress-gw}
    profiles: [runners]
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    init: true
    logging: *egress-logging
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EGRESS_SOCKS5_URL: ${RUNNER_EGRESS_SOCKS5_URL:-${EGRESS_SOCKS5_URL:-}}
      EGRESS_DNS_SERVER: ${EGRESS_DNS_SERVER:-1.1.1.1}
      EGRESS_DNS_STRATEGY: ${EGRESS_DNS_STRATEGY:-ipv4_only}
      EGRESS_INTERNAL_DOMAINS: ${RUNNER_EGRESS_INTERNAL_DOMAINS:-artex}
      EGRESS_BYPASS_DOMAINS: ${RUNNER_EGRESS_BYPASS_DOMAINS:-${EGRESS_BYPASS_DOMAINS:-}}
      EGRESS_BYPASS_CIDRS: ${RUNNER_EGRESS_BYPASS_CIDRS:-${EGRESS_BYPASS_CIDRS:-}}
      EGRESS_KILL_SWITCH: ${EGRESS_KILL_SWITCH:-1}
      EGRESS_SOCKS5_UDP: ${EGRESS_SOCKS5_UDP:-0}
      EGRESS_HIJACK_TUN_DNS: ${EGRESS_HIJACK_TUN_DNS:-1}
      EGRESS_IPV6: ${EGRESS_IPV6:-0}
      EGRESS_TUN_ADDR: ${RUNNER_EGRESS_TUN_ADDR:-198.19.0.5/30}
      EGRESS_LOG_LEVEL: ${EGRESS_LOG_LEVEL:-info}
    networks:
      - runners
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/egress-ready && ip -4 addr show dev tun0 2>/dev/null | grep -q 'inet ' && pidof sing-box >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  runner-manager:
    depends_on:
      artex:
        condition: service_started
      runner-egress-gw:
        condition: service_healthy
    environment:
      ARTEX_RUNNER_DOCKER_NETWORK: container:${ARTEX_RUNNER_EGRESS_CONTAINER:-artex-runner-egress-gw}
